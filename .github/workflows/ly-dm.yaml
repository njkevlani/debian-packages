name: Build ly for Debian

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Ly release tag'
        required: true
        default: 'v1.3.2'

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - arch: arm64
            builder: ubuntu-24.04-arm
          - arch: amd64
            builder: ubuntu-24.04

    name: Build
    runs-on: ${{ matrix.builder }}
    container: debian:sid

    env:
      VERSION: ${{ github.event.inputs.version }}
      DEB_BUILD_OPTIONS: nocheck

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            devscripts \
            equivs \
            xz-utils
          mk-build-deps -i -t "apt-get -y --no-install-recommends" \
            ./packaging/ly-deb/debian/control

      - uses: mlugg/setup-zig@v2

      - name: Prepare Debian packaging
        run: |
          set -e
          UPSTREAM_VERSION="${VERSION#v}"
          curl -L \
            -o "ly_${UPSTREAM_VERSION}.orig.tar.gz" \
            "https://github.com/fairyglade/ly/archive/refs/tags/v${UPSTREAM_VERSION}.tar.gz"
          tar -xzf "ly_${UPSTREAM_VERSION}.orig.tar.gz"
          cd "ly-${UPSTREAM_VERSION}"

          cp -a ../packaging/ly-deb/debian ./debian
          chmod +x debian/rules
          cat > debian/changelog <<EOF
          ly (${UPSTREAM_VERSION}-1) unstable; urgency=medium

            * Package upstream release ${VERSION}.

           -- Debian Packaging CI <ci@example.com>  $(date -R)
          EOF

      - name: Build Debian package
        run: |
          UPSTREAM_VERSION="${VERSION#v}"
          cd "ly-${UPSTREAM_VERSION}"
          dpkg-buildpackage -us -uc -b

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ly-deb-${{ matrix.arch }}
          path: |
            ly_*_${{ matrix.arch }}.deb
