name: Build yaml-language-server for Debian

on:
  workflow_dispatch:
    inputs:
      version:
        description: "yaml-language-server release tag"
        required: true
        default: "1.19.2"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build yaml-language-server Debian package
    runs-on: ubuntu-24.04
    container: debian:sid

    env:
      VERSION: ${{ github.event.inputs.version }}
      DEB_BUILD_OPTIONS: nocheck

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            devscripts \
            equivs \
            xz-utils
          mk-build-deps -i -t "apt-get -y --no-install-recommends" \
            ./packaging/yaml-language-server-deb/debian/control

      - name: Prepare Debian packaging
        run: |
          set -e
          UPSTREAM_VERSION="${VERSION#v}"
          curl -L \
            -o "yaml-language-server_${UPSTREAM_VERSION}.orig.tar.gz" \
            "https://github.com/redhat-developer/yaml-language-server/archive/refs/tags/${UPSTREAM_VERSION}.tar.gz"
          tar -xzf "yaml-language-server_${UPSTREAM_VERSION}.orig.tar.gz"
          cd "yaml-language-server-${UPSTREAM_VERSION}"

          cp -a ../packaging/yaml-language-server-deb/debian ./debian
          chmod +x debian/rules
          patch -Np1 --forward < debian/patches/0001-vscode-l10n-is-a-runtime-dependency.patch || true
          sed \
            -e "s/@UPSTREAM_VERSION@/${UPSTREAM_VERSION}/" \
            -e "s/@DATE@/$(date -R)/" \
            debian/changelog.in > debian/changelog
          rm -f debian/changelog.in

      - name: Build Debian package
        run: |
          UPSTREAM_VERSION="${VERSION#v}"
          cd "yaml-language-server-${UPSTREAM_VERSION}"
          dpkg-buildpackage -us -uc -b
          rm -f ../*.buildinfo ../*.changes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaml-language-server-deb
          path: |
            yaml-language-server_*_all.deb

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yaml-language-server-${{ env.VERSION }}
          name: yaml-language-server ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            yaml-language-server_*_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
