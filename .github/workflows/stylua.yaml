name: Build stylua for Debian

on:
  workflow_dispatch:
    inputs:
      version:
        description: "StyLua release tag"
        required: true
        default: "v2.3.1"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build stylua Debian package
    runs-on: ${{ matrix.runner }}
    container: debian:sid
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      VERSION: ${{ github.event.inputs.version }}
      DEB_BUILD_OPTIONS: nocheck

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            devscripts \
            equivs \
            xz-utils
          mk-build-deps -i -t "apt-get -y --no-install-recommends" \
            ./packaging/stylua-deb/debian/control

      - name: Prepare Debian packaging
        run: |
          set -e
          UPSTREAM_VERSION="${VERSION#v}"
          curl -L \
            -o "stylua_${UPSTREAM_VERSION}.orig.tar.gz" \
            "https://github.com/JohnnyMorganz/StyLua/archive/refs/tags/v${UPSTREAM_VERSION}.tar.gz"
          tar -xzf "stylua_${UPSTREAM_VERSION}.orig.tar.gz"
          cd "StyLua-${UPSTREAM_VERSION}"

          cp -a ../packaging/stylua-deb/debian ./debian
          chmod +x debian/rules
          sed \
            -e "s/@UPSTREAM_VERSION@/${UPSTREAM_VERSION}/" \
            -e "s/@DATE@/$(date -R)/" \
            debian/changelog.in > debian/changelog
          rm -f debian/changelog.in

      - name: Build Debian package
        run: |
          UPSTREAM_VERSION="${VERSION#v}"
          cd "StyLua-${UPSTREAM_VERSION}"
          dpkg-buildpackage -us -uc -b
          rm -f ../*.buildinfo ../*.changes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stylua-deb-${{ matrix.arch }}
          path: |
            stylua_*_${{ matrix.arch }}.deb

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stylua-${{ env.VERSION }}
          name: stylua ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            stylua_*_${{ matrix.arch }}.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
