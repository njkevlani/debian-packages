name: Build rofi-calc for Debian

on:
  workflow_dispatch:
    inputs:
      version:
        description: "rofi-calc release tag"
        required: true
        default: "v2.5.0"

jobs:
  build-deb:
    name: Build rofi-calc Debian package
    runs-on: ${{ matrix.runner }}
    container: debian:sid
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      VERSION: ${{ github.event.inputs.version }}
      DEB_BUILD_OPTIONS: nocheck

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            devscripts \
            equivs \
            xz-utils
          mk-build-deps -i -t "apt-get -y --no-install-recommends" \
            ./packaging/rofi-calc-deb/debian/control

      - name: Prepare Debian packaging
        run: |
          set -e
          UPSTREAM_VERSION="${VERSION#v}"
          curl -L \
            -o "rofi-calc_${UPSTREAM_VERSION}.orig.tar.gz" \
            "https://github.com/svenstaro/rofi-calc/archive/refs/tags/v${UPSTREAM_VERSION}.tar.gz"
          tar -xzf "rofi-calc_${UPSTREAM_VERSION}.orig.tar.gz"
          cd "rofi-calc-${UPSTREAM_VERSION}"

          cp -a ../packaging/rofi-calc-deb/debian ./debian
          chmod +x debian/rules
          sed \
            -e "s/@UPSTREAM_VERSION@/${UPSTREAM_VERSION}/" \
            -e "s/@DATE@/$(date -R)/" \
            debian/changelog.in > debian/changelog
          rm -f debian/changelog.in

      - name: Build Debian package
        run: |
          UPSTREAM_VERSION="${VERSION#v}"
          cd "rofi-calc-${UPSTREAM_VERSION}"
          dpkg-buildpackage -us -uc -b
          rm -f ../*.buildinfo ../*.changes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rofi-calc-deb-${{ matrix.arch }}
          path: |
            rofi-calc_*_${{ matrix.arch }}.deb
