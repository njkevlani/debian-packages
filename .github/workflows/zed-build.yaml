name: Build Zed (Linux)

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Zed repository"
        required: true
        default: "zed-industries/zed"
      ref:
        description: "Git ref (branch, tag, or sha)"
        required: true
        default: "main"

jobs:
  build-zed:
    name: Build Zed
    runs-on: ${{ matrix.runner }}
    container: debian:sid
    env:
      GIT_DISCOVERY_ACROSS_FILESYSTEM: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Zed
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: zed

      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git

      - name: Install Zed build dependencies
        run: ./script/linux
        working-directory: zed

      - name: Build Zed bundle
        run: |
          . "$HOME/.cargo/env"
          ./script/bundle-linux
        working-directory: zed

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zed-linux-${{ matrix.arch }}-${{ inputs.ref }}
          path: |
            zed/target/release/zed-linux-*.tar.gz
