name: Build ghostty for Debian

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Ghostty release tag'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - arch: arm64
            builder: ubuntu-24.04-arm
          - arch: amd64
            builder: ubuntu-24.04

    name: Build
    runs-on: ${{ matrix.builder }}

    container:
      image: debian:sid


    env:
      VERSION: ${{ github.event.inputs.version }}
      DEB_BUILD_OPTIONS: nocheck

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            devscripts \
            equivs \
            xz-utils
          mk-build-deps -i -t "apt-get -y --no-install-recommends" \
            ./packaging/ghostty-deb/debian/control

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Prepare Debian packaging
        run: |
          set -e
          UPSTREAM_VERSION="${VERSION#v}"
          curl -L \
            -o "ghostty_${UPSTREAM_VERSION}.orig.tar.gz" \
            "https://github.com/ghostty-org/ghostty/archive/refs/tags/v${UPSTREAM_VERSION}.tar.gz"
          tar -xzf "ghostty_${UPSTREAM_VERSION}.orig.tar.gz"
          cd "ghostty-${UPSTREAM_VERSION}"

          cp -a ../packaging/ghostty-deb/debian ./debian
          chmod +x debian/rules
          cat > debian/changelog <<EOF
          ghostty (${UPSTREAM_VERSION}-1) unstable; urgency=medium

            * Package upstream release ${VERSION}.

           -- Debian Packaging CI <ci@example.com>  $(date -R)
          EOF

      - name: Build Debian package
        run: |
          UPSTREAM_VERSION="${VERSION#v}"
          cd "ghostty-${UPSTREAM_VERSION}"
          dpkg-buildpackage -us -uc -b

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-deb-${{ matrix.arch }}
          path: |
            ghostty_*_${{ matrix.arch }}.deb

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghostty-${{ env.VERSION }}
          name: ghostty ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            ghostty_*_${{ matrix.arch }}.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
