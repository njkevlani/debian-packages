# The kernel builds and able to install it. It boots and I'm able to access
# tty, but GUI is not working.
name: Build Asahi Kernel (ARM)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Asahi Linux commit SHA'
        required: true
        default: 'b0b5bbf9f67e9063af591e7a1187d37d0f2b8e29'

permissions:
  contents: write

jobs:
  build:
    name: Build Asahi Kernel on ARM
    runs-on: ubuntu-24.04-arm
    container: debian:sid

    env:
      COMMIT_SHA: ${{ github.event.inputs.commit }}
      ARCH: arm64

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            devscripts \
            equivs \
            xz-utils
          mk-build-deps -i -t "apt-get -y --no-install-recommends" \
            ./packaging/asahi-kernel-deb/debian/control

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download Asahi Linux kernel
        run: |
          curl -L \
            -o "linux_${COMMIT_SHA}.tar.gz" \
            "https://github.com/AsahiLinux/linux/archive/${COMMIT_SHA}.tar.gz"
          tar -xzf "linux_${COMMIT_SHA}.tar.gz"
          mv "linux-${COMMIT_SHA}" linux

      - name: Fetch official Asahi kernel config (PKGBUILD)
        run: |
          curl -L -o linux/config \
            https://raw.githubusercontent.com/asahi-alarm/PKGBUILDs/main/linux-asahi/config

      - name: Configure kernel (Asahi ALARM config)
        run: |
          cd linux
          cat config > .config
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-asahi-fairydust"/' .config

      - name: Build Debian kernel packages
        run: |
          cd linux
          make -j$(nproc) \
            bindeb-pkg

      - name: Show generated packages
        run: |
          ls -lh

      - name: Collect Debian packages
        run: |
          mkdir -p artifacts
          mv *.deb artifacts/

      - name: Upload Debian kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: asahi-kernel-debs
          path: artifacts/

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asahi-kernel-${{ env.COMMIT_SHA }}
          name: asahi-kernel ${{ env.COMMIT_SHA }}
          draft: false
          prerelease: false
          files: |
            artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
